<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON STRIKE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000;
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; }
        
        #blocker {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        #blocker h1 {
            font-size: 5rem;
            color: #0ff;
            text-shadow: 
                0 0 10px #0ff,
                0 0 20px #0ff,
                0 0 40px #0ff,
                0 0 80px #08f;
            letter-spacing: 0.5rem;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        #blocker p {
            color: #f0f;
            font-size: 1.5rem;
            margin-top: 2rem;
            text-shadow: 0 0 10px #f0f;
        }
        
        #blocker .instructions {
            color: #888;
            font-size: 1rem;
            margin-top: 3rem;
            text-align: center;
            line-height: 2;
        }
        
        #hud {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px; height: 30px;
        }
        
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #0ff;
            box-shadow: 0 0 10px #0ff;
        }
        
        #crosshair::before {
            width: 2px; height: 100%;
            left: 50%; transform: translateX(-50%);
        }
        
        #crosshair::after {
            width: 100%; height: 2px;
            top: 50%; transform: translateY(-50%);
        }
        
        #stats {
            position: absolute;
            bottom: 30px; left: 30px;
            color: #0ff;
            font-size: 1.2rem;
            text-shadow: 0 0 10px #0ff;
        }
        
        #health-bar {
            width: 200px; height: 20px;
            background: rgba(255,0,0,0.2);
            border: 2px solid #f00;
            box-shadow: 0 0 10px #f00;
            margin-bottom: 10px;
        }
        
        #health-fill {
            height: 100%;
            background: linear-gradient(90deg, #f00, #f0f);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
            transition: width 0.3s;
        }
        
        #shield-bar {
            width: 200px; height: 10px;
            background: rgba(0,255,255,0.1);
            border: 1px solid #0ff;
            margin-bottom: 10px;
        }
        
        #shield-fill {
            height: 100%;
            background: #0ff;
            box-shadow: 0 0 10px #0ff;
            transition: width 0.3s;
        }
        
        #score-display {
            position: absolute;
            top: 30px; right: 30px;
            text-align: right;
            color: #f0f;
            font-size: 1.5rem;
            text-shadow: 0 0 10px #f0f;
        }
        
        #wave-display {
            position: absolute;
            top: 30px; left: 50%;
            transform: translateX(-50%);
            color: #ff0;
            font-size: 2rem;
            text-shadow: 0 0 20px #ff0;
        }
        
        #powerup-display {
            position: absolute;
            bottom: 30px; right: 30px;
            text-align: right;
            color: #0f0;
            font-size: 1rem;
        }
        
        #game-over {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        
        #game-over h1 {
            color: #f00;
            font-size: 4rem;
            text-shadow: 0 0 30px #f00;
        }
        
        #game-over p {
            color: #fff;
            font-size: 1.5rem;
            margin: 2rem 0;
        }
        
        #damage-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 50%, rgba(255,0,0,0.3) 100%);
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="blocker">
        <h1>NEON STRIKE</h1>
        <p>Click to Play</p>
        <div class="instructions">
            WASD - Move | MOUSE - Look | CLICK - Shoot | SHIFT - Sprint<br>
            Survive the waves. Collect powerups. Dominate.
        </div>
    </div>
    
    <div id="hud" style="display: none;">
        <div id="crosshair"></div>
        <div id="stats">
            <div id="health-bar"><div id="health-fill" style="width: 100%"></div></div>
            <div id="shield-bar"><div id="shield-fill" style="width: 0%"></div></div>
            <div id="ammo">∞ PLASMA</div>
        </div>
        <div id="score-display">
            <div id="score">SCORE: 0</div>
            <div id="kills">KILLS: 0</div>
        </div>
        <div id="wave-display">WAVE 1</div>
        <div id="powerup-display"></div>
    </div>
    
    <div id="damage-overlay"></div>
    
    <div id="game-over">
        <h1>GAME OVER</h1>
        <p id="final-score">Final Score: 0</p>
        <p>Click to Restart</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game State
        const state = {
            health: 100,
            maxHealth: 100,
            shield: 0,
            score: 0,
            kills: 0,
            wave: 1,
            isPlaying: false,
            gameOver: false,
            speedBoost: false,
            rapidFire: false,
            lastShot: 0,
            fireRate: 150,
        };

        // Three.js Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x111122, 0.5);
        scene.add(ambientLight);

        const centerLight = new THREE.PointLight(0x0088ff, 2, 50);
        centerLight.position.set(0, 15, 0);
        centerLight.castShadow = true;
        scene.add(centerLight);

        // Corner lights
        const cornerColors = [0xff00ff, 0x00ffff, 0xff0088, 0x00ff88];
        const corners = [[-40, 40], [40, 40], [-40, -40], [40, -40]];
        corners.forEach((pos, i) => {
            const light = new THREE.PointLight(cornerColors[i], 1.5, 40);
            light.position.set(pos[0], 8, pos[1]);
            scene.add(light);
        });

        // Player controls
        const moveState = { forward: false, backward: false, left: false, right: false, sprint: false };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let yaw = 0, pitch = 0;

        // Collections
        const bullets = [];
        const enemies = [];
        const powerups = [];
        const particles = [];
        const explosions = [];

        // Materials
        const neonMaterials = {
            cyan: new THREE.MeshStandardMaterial({ 
                color: 0x00ffff, 
                emissive: 0x00ffff, 
                emissiveIntensity: 0.5,
                metalness: 0.8,
                roughness: 0.2
            }),
            magenta: new THREE.MeshStandardMaterial({ 
                color: 0xff00ff, 
                emissive: 0xff00ff, 
                emissiveIntensity: 0.5,
                metalness: 0.8,
                roughness: 0.2
            }),
            yellow: new THREE.MeshStandardMaterial({ 
                color: 0xffff00, 
                emissive: 0xffff00, 
                emissiveIntensity: 0.5
            }),
            green: new THREE.MeshStandardMaterial({ 
                color: 0x00ff00, 
                emissive: 0x00ff00, 
                emissiveIntensity: 0.5
            }),
            red: new THREE.MeshStandardMaterial({ 
                color: 0xff0000, 
                emissive: 0xff0000, 
                emissiveIntensity: 0.5
            }),
        };

        // Create Arena
        function createArena() {
            // Floor
            const floorGeo = new THREE.PlaneGeometry(100, 100, 50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x111122,
                metalness: 0.9,
                roughness: 0.3
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Grid lines
            const gridHelper = new THREE.GridHelper(100, 50, 0x00ffff, 0x001133);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // Walls
            const wallMat = new THREE.MeshStandardMaterial({
                color: 0x0a0a1a,
                metalness: 0.7,
                roughness: 0.5,
                transparent: true,
                opacity: 0.8
            });

            const wallGeo = new THREE.BoxGeometry(100, 15, 1);
            const walls = [
                { pos: [0, 7.5, -50], rot: [0, 0, 0] },
                { pos: [0, 7.5, 50], rot: [0, 0, 0] },
                { pos: [-50, 7.5, 0], rot: [0, Math.PI / 2, 0] },
                { pos: [50, 7.5, 0], rot: [0, Math.PI / 2, 0] }
            ];

            walls.forEach(w => {
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(...w.pos);
                wall.rotation.set(...w.rot);
                scene.add(wall);

                // Neon trim
                const trimGeo = new THREE.BoxGeometry(100, 0.2, 0.1);
                const trim = new THREE.Mesh(trimGeo, neonMaterials.cyan);
                trim.position.copy(wall.position);
                trim.position.y = 0.1;
                trim.rotation.copy(wall.rotation);
                scene.add(trim);
            });

            // Platforms
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const radius = 25 + Math.random() * 10;
                const platform = createPlatform(
                    Math.cos(angle) * radius,
                    Math.random() * 3 + 1,
                    Math.sin(angle) * radius
                );
                scene.add(platform);
            }

            // Center structure
            const centerGeo = new THREE.CylinderGeometry(3, 4, 2, 8);
            const center = new THREE.Mesh(centerGeo, neonMaterials.magenta);
            center.position.y = 1;
            center.castShadow = true;
            scene.add(center);

            // Floating orbs
            for (let i = 0; i < 20; i++) {
                const orb = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2, 16, 16),
                    new THREE.MeshBasicMaterial({ 
                        color: Math.random() > 0.5 ? 0x00ffff : 0xff00ff,
                        transparent: true,
                        opacity: 0.6
                    })
                );
                orb.position.set(
                    (Math.random() - 0.5) * 80,
                    Math.random() * 10 + 3,
                    (Math.random() - 0.5) * 80
                );
                orb.userData = { 
                    baseY: orb.position.y, 
                    speed: Math.random() * 2 + 1,
                    phase: Math.random() * Math.PI * 2
                };
                scene.add(orb);
                particles.push(orb);
            }
        }

        function createPlatform(x, y, z) {
            const group = new THREE.Group();
            
            const platformGeo = new THREE.BoxGeometry(6, 0.5, 6);
            const platformMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                metalness: 0.8,
                roughness: 0.3
            });
            const platform = new THREE.Mesh(platformGeo, platformMat);
            platform.castShadow = true;
            platform.receiveShadow = true;
            group.add(platform);

            // Edge glow
            const edgeGeo = new THREE.EdgesGeometry(platformGeo);
            const edgeMat = new THREE.LineBasicMaterial({ color: 0x00ffff });
            const edges = new THREE.LineSegments(edgeGeo, edgeMat);
            group.add(edges);

            group.position.set(x, y, z);
            return group;
        }

        // Create Enemy
        function createEnemy(wave) {
            const group = new THREE.Group();
            
            // Body - geometric drone
            const bodyGeo = new THREE.OctahedronGeometry(1, 0);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0xff0044,
                emissive: 0xff0022,
                emissiveIntensity: 0.3,
                metalness: 0.9,
                roughness: 0.2
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            group.add(body);

            // Eye/core
            const eyeGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const eye = new THREE.Mesh(eyeGeo, eyeMat);
            eye.position.z = 0.5;
            group.add(eye);

            // Spawn position
            const angle = Math.random() * Math.PI * 2;
            const radius = 35 + Math.random() * 10;
            group.position.set(
                Math.cos(angle) * radius,
                2 + Math.random() * 2,
                Math.sin(angle) * radius
            );

            // Stats scale with wave
            group.userData = {
                health: 20 + wave * 10,
                maxHealth: 20 + wave * 10,
                speed: 0.03 + wave * 0.005,
                damage: 5 + wave * 2,
                lastAttack: 0,
                type: 'drone'
            };

            scene.add(group);
            enemies.push(group);
            return group;
        }

        // Create Powerup
        function createPowerup(position, type) {
            const group = new THREE.Group();
            
            const colors = {
                health: 0x00ff00,
                shield: 0x00ffff,
                speed: 0xffff00,
                rapid: 0xff00ff
            };

            const geo = new THREE.IcosahedronGeometry(0.5, 0);
            const mat = new THREE.MeshStandardMaterial({
                color: colors[type],
                emissive: colors[type],
                emissiveIntensity: 0.8,
                metalness: 0.5,
                roughness: 0.3
            });
            const mesh = new THREE.Mesh(geo, mat);
            group.add(mesh);

            // Outer ring
            const ringGeo = new THREE.TorusGeometry(0.8, 0.05, 8, 32);
            const ring = new THREE.Mesh(ringGeo, mat);
            ring.rotation.x = Math.PI / 2;
            group.add(ring);

            group.position.copy(position);
            group.position.y = 1;
            group.userData = { type, rotationSpeed: 0.02 };

            scene.add(group);
            powerups.push(group);
            return group;
        }

        // Shoot
        function shoot() {
            const now = Date.now();
            const fireRate = state.rapidFire ? state.fireRate / 2 : state.fireRate;
            if (now - state.lastShot < fireRate) return;
            state.lastShot = now;

            const bulletGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ 
                color: 0x00ffff,
            });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            // Trail
            const trailGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 8);
            const trailMat = new THREE.MeshBasicMaterial({ 
                color: 0x00ffff, 
                transparent: true, 
                opacity: 0.5 
            });
            const trail = new THREE.Mesh(trailGeo, trailMat);
            trail.rotation.x = Math.PI / 2;
            trail.position.z = -0.25;
            bullet.add(trail);

            bullet.position.copy(camera.position);
            
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            bullet.userData = { 
                velocity: direction.multiplyScalar(2),
                life: 100
            };

            scene.add(bullet);
            bullets.push(bullet);

            // Muzzle flash
            createMuzzleFlash();
        }

        function createMuzzleFlash() {
            const flash = new THREE.PointLight(0x00ffff, 3, 5);
            flash.position.copy(camera.position);
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            flash.position.add(dir.multiplyScalar(0.5));
            scene.add(flash);
            
            setTimeout(() => scene.remove(flash), 50);
        }

        // Create Explosion
        function createExplosion(position, color = 0xff4400) {
            const particleCount = 20;
            const explosionGroup = [];

            for (let i = 0; i < particleCount; i++) {
                const geo = new THREE.SphereGeometry(0.1 + Math.random() * 0.1, 8, 8);
                const mat = new THREE.MeshBasicMaterial({ 
                    color: color,
                    transparent: true,
                    opacity: 1
                });
                const particle = new THREE.Mesh(geo, mat);
                particle.position.copy(position);
                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.3,
                        Math.random() * 0.2,
                        (Math.random() - 0.5) * 0.3
                    ),
                    life: 1
                };
                scene.add(particle);
                explosionGroup.push(particle);
            }
            explosions.push(explosionGroup);

            // Flash light
            const flash = new THREE.PointLight(color, 5, 10);
            flash.position.copy(position);
            scene.add(flash);
            setTimeout(() => scene.remove(flash), 100);
        }

        // Update bullets
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.position.add(bullet.userData.velocity);
                bullet.userData.life--;

                // Check enemy collisions
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (bullet.position.distanceTo(enemy.position) < 1.5) {
                        enemy.userData.health -= 25;
                        
                        createExplosion(bullet.position, 0x00ffff);
                        
                        if (enemy.userData.health <= 0) {
                            createExplosion(enemy.position, 0xff0044);
                            scene.remove(enemy);
                            enemies.splice(j, 1);
                            state.score += 100 * state.wave;
                            state.kills++;
                            updateHUD();

                            // Chance to drop powerup
                            if (Math.random() < 0.2) {
                                const types = ['health', 'shield', 'speed', 'rapid'];
                                createPowerup(enemy.position.clone(), types[Math.floor(Math.random() * types.length)]);
                            }
                        }

                        scene.remove(bullet);
                        bullets.splice(i, 1);
                        break;
                    }
                }

                // Remove old bullets
                if (bullet.userData.life <= 0 || 
                    Math.abs(bullet.position.x) > 50 || 
                    Math.abs(bullet.position.z) > 50) {
                    scene.remove(bullet);
                    bullets.splice(i, 1);
                }
            }
        }

        // Update enemies
        function updateEnemies() {
            const now = Date.now();
            
            enemies.forEach(enemy => {
                // Move toward player
                const direction = new THREE.Vector3();
                direction.subVectors(camera.position, enemy.position);
                direction.y = 0;
                direction.normalize();
                
                enemy.position.add(direction.multiplyScalar(enemy.userData.speed));
                
                // Hover animation
                enemy.position.y = 2 + Math.sin(now * 0.003 + enemy.id) * 0.3;
                
                // Rotate
                enemy.rotation.y += 0.02;
                enemy.rotation.x = Math.sin(now * 0.002) * 0.2;

                // Attack player
                const distToPlayer = enemy.position.distanceTo(camera.position);
                if (distToPlayer < 3 && now - enemy.userData.lastAttack > 1000) {
                    enemy.userData.lastAttack = now;
                    takeDamage(enemy.userData.damage);
                }
            });
        }

        // Update explosions
        function updateExplosions() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const group = explosions[i];
                let allDead = true;

                for (let j = group.length - 1; j >= 0; j--) {
                    const particle = group[j];
                    particle.position.add(particle.userData.velocity);
                    particle.userData.velocity.y -= 0.01;
                    particle.userData.life -= 0.02;
                    particle.material.opacity = particle.userData.life;
                    particle.scale.setScalar(particle.userData.life);

                    if (particle.userData.life > 0) {
                        allDead = false;
                    } else {
                        scene.remove(particle);
                        group.splice(j, 1);
                    }
                }

                if (allDead) {
                    explosions.splice(i, 1);
                }
            }
        }

        // Update powerups
        function updatePowerups() {
            for (let i = powerups.length - 1; i >= 0; i--) {
                const powerup = powerups[i];
                powerup.rotation.y += powerup.userData.rotationSpeed;
                powerup.position.y = 1 + Math.sin(Date.now() * 0.003) * 0.2;

                // Check collection
                if (powerup.position.distanceTo(camera.position) < 2) {
                    applyPowerup(powerup.userData.type);
                    createExplosion(powerup.position, 0x00ff00);
                    scene.remove(powerup);
                    powerups.splice(i, 1);
                }
            }
        }

        function applyPowerup(type) {
            switch (type) {
                case 'health':
                    state.health = Math.min(state.health + 30, state.maxHealth);
                    break;
                case 'shield':
                    state.shield = 100;
                    break;
                case 'speed':
                    state.speedBoost = true;
                    setTimeout(() => { state.speedBoost = false; updateHUD(); }, 10000);
                    break;
                case 'rapid':
                    state.rapidFire = true;
                    setTimeout(() => { state.rapidFire = false; updateHUD(); }, 8000);
                    break;
            }
            updateHUD();
        }

        // Take damage
        function takeDamage(amount) {
            if (state.shield > 0) {
                state.shield = Math.max(0, state.shield - amount);
            } else {
                state.health -= amount;
            }
            
            document.getElementById('damage-overlay').style.opacity = '0.5';
            setTimeout(() => {
                document.getElementById('damage-overlay').style.opacity = '0';
            }, 100);

            updateHUD();

            if (state.health <= 0) {
                gameOver();
            }
        }

        // Wave management
        function spawnWave() {
            const enemyCount = 3 + state.wave * 2;
            for (let i = 0; i < enemyCount; i++) {
                setTimeout(() => createEnemy(state.wave), i * 500);
            }
        }

        function checkWaveComplete() {
            if (enemies.length === 0 && state.isPlaying) {
                state.wave++;
                document.getElementById('wave-display').textContent = `WAVE ${state.wave}`;
                document.getElementById('wave-display').style.animation = 'pulse 0.5s';
                setTimeout(() => {
                    document.getElementById('wave-display').style.animation = '';
                }, 500);
                setTimeout(spawnWave, 2000);
            }
        }

        // Update HUD
        function updateHUD() {
            document.getElementById('health-fill').style.width = `${state.health}%`;
            document.getElementById('shield-fill').style.width = `${state.shield}%`;
            document.getElementById('score').textContent = `SCORE: ${state.score}`;
            document.getElementById('kills').textContent = `KILLS: ${state.kills}`;
            
            let powerupText = '';
            if (state.speedBoost) powerupText += '⚡ SPEED BOOST\n';
            if (state.rapidFire) powerupText += '🔥 RAPID FIRE\n';
            document.getElementById('powerup-display').textContent = powerupText;
        }

        // Player movement
        function updatePlayer(delta) {
            if (!state.isPlaying) return;

            const speed = state.speedBoost ? 0.3 : 0.15;
            const sprintMultiplier = moveState.sprint ? 1.8 : 1;

            velocity.x -= velocity.x * 10 * delta;
            velocity.z -= velocity.z * 10 * delta;

            direction.z = Number(moveState.forward) - Number(moveState.backward);
            direction.x = Number(moveState.right) - Number(moveState.left);
            direction.normalize();

            if (moveState.forward || moveState.backward) {
                velocity.z -= direction.z * speed * sprintMultiplier;
            }
            if (moveState.left || moveState.right) {
                velocity.x -= direction.x * speed * sprintMultiplier;
            }

            // Apply movement in camera direction
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0));

            camera.position.add(forward.multiplyScalar(-velocity.z));
            camera.position.add(right.multiplyScalar(-velocity.x));

            // Boundary check
            camera.position.x = Math.max(-45, Math.min(45, camera.position.x));
            camera.position.z = Math.max(-45, Math.min(45, camera.position.z));
            camera.position.y = 2;
        }

        // Update floating particles
        function updateParticles() {
            const time = Date.now() * 0.001;
            particles.forEach(p => {
                p.position.y = p.userData.baseY + Math.sin(time * p.userData.speed + p.userData.phase) * 0.5;
                p.rotation.y += 0.01;
            });
        }

        // Game over
        function gameOver() {
            state.isPlaying = false;
            state.gameOver = true;
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('final-score').textContent = `Final Score: ${state.score} | Wave: ${state.wave} | Kills: ${state.kills}`;
            document.exitPointerLock();
        }

        // Reset game
        function resetGame() {
            // Clear entities
            [...enemies, ...bullets, ...powerups].forEach(e => scene.remove(e));
            enemies.length = 0;
            bullets.length = 0;
            powerups.length = 0;
            explosions.forEach(group => group.forEach(p => scene.remove(p)));
            explosions.length = 0;

            // Reset state
            state.health = 100;
            state.shield = 0;
            state.score = 0;
            state.kills = 0;
            state.wave = 1;
            state.speedBoost = false;
            state.rapidFire = false;
            state.gameOver = false;

            camera.position.set(0, 2, 0);
            yaw = 0;
            pitch = 0;

            updateHUD();
            document.getElementById('wave-display').textContent = 'WAVE 1';
            document.getElementById('game-over').style.display = 'none';

            setTimeout(spawnWave, 1000);
        }

        // Input handlers
        document.addEventListener('keydown', (e) => {
            if (!state.isPlaying) return;
            switch (e.code) {
                case 'KeyW': moveState.forward = true; break;
                case 'KeyS': moveState.backward = true; break;
                case 'KeyA': moveState.left = true; break;
                case 'KeyD': moveState.right = true; break;
                case 'ShiftLeft': moveState.sprint = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveState.forward = false; break;
                case 'KeyS': moveState.backward = false; break;
                case 'KeyA': moveState.left = false; break;
                case 'KeyD': moveState.right = false; break;
                case 'ShiftLeft': moveState.sprint = false; break;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!state.isPlaying) return;
            
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        });

        let isMouseDown = false;
        document.addEventListener('mousedown', () => { isMouseDown = true; });
        document.addEventListener('mouseup', () => { isMouseDown = false; });

        // Pointer lock
        document.getElementById('blocker').addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.getElementById('game-over').addEventListener('click', () => {
            if (state.gameOver) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement) {
                document.getElementById('blocker').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                
                if (state.gameOver) {
                    resetGame();
                }
                
                if (!state.isPlaying && !state.gameOver) {
                    state.isPlaying = true;
                    spawnWave();
                }
            } else {
                if (!state.gameOver) {
                    document.getElementById('blocker').style.display = 'flex';
                    document.getElementById('blocker').querySelector('p').textContent = 'Click to Resume';
                }
            }
        });

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        createArena();

        // Animation loop
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = (now - lastTime) / 1000;
            lastTime = now;

            if (state.isPlaying) {
                if (isMouseDown) shoot();
                updatePlayer(delta);
                updateBullets();
                updateEnemies();
                updateExplosions();
                updatePowerups();
                checkWaveComplete();
            }

            updateParticles();

            // Animate center light
            centerLight.intensity = 2 + Math.sin(now * 0.002) * 0.5;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
